<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>

<body>
  <header>
    <h2>
      Escaner SQL
    </h2>
    <p>Por: Manuel Eduardo Peñaloza López</p>
  </header>
  <main class="main">
    <article class="left">
      <form>
        <div class="header-form">
          <label for="input">Ingrese una sentencia sql</label>
          <input type="button" name="escan" value=" Generar Tablas -> " id="run">
        </div>
        <textarea autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="inputSql"
          id="input" rows="10" cols="70"></textarea>
      </form>
      <div class="console">
        <h4>Resultados:</h4>
        <p id="log"> ></p>
      </div>
    </article>
    <article class="results">
      <table id="lexicon">
        <tr>
          <th>Token</th>
          <th>Codigo</th>
          <th>Reglas asociadas</th>
        </tr>
      </table>
    </article>
  </main>
</body>

</html>
